name: Unzip and Overwrite Files

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  unzip-job:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Proses unzip menggunakan nama file yang benar
      - name: Unzip Archive and Overwrite
        run: |
          unzip -o GeneratorSoalSandi-UPDATED-FILES.zip -d .

      # 3. Menyimpan perubahan kembali ke repositori
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan file baru."
          else
            git commit -m "Automated: Unzip and overwrite files [skip ci]"
            git push
          fi
          

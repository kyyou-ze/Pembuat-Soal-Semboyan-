name: Ekstrak, Ratakan, dan Timpa Zip

on:
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions di GitHub

jobs:
  unzip-and-flatten:
    runs-on: ubuntu-latest
    
    # Memberikan izin token untuk menulis (write) ke repositori
    permissions:
      contents: write

    steps:
      - name: Ambil kode repo
        uses: actions/checkout@v4

      - name: Cari dan ekstrak zip secara merata (flatten)
        run: |
          # Ganti 'file.zip' dengan nama file zip Anda jika berbeda
          ZIP_FILE="GeneratorSoalSandi-UPDATED-FILES.zip"
          
          if [ -f "$ZIP_FILE" ]; then
            echo "Mengekstrak dan meratakan isi $ZIP_FILE..."
            # Ekstrak semua file langsung ke direktori saat ini (-j = junk paths) (-o = overwrite)
            unzip -j -o "$ZIP_FILE" -d .
            
            echo "Menghapus file zip asli..."
            rm "$ZIP_FILE"
          else
            echo "Error: File $ZIP_FILE tidak ditemukan!"
            exit 1
          fi

      - name: Commit perubahan ke repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          # Menghindari error jika tidak ada perubahan file setelah unzip
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit"
          else
            git commit -m "chore: ekstrak, ratakan, dan timpa file dari zip"
            git push origin HEAD:${{ github.ref }}
          fi
          

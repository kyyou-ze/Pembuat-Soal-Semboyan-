name: Build APK

# Builds the app entirely on GitHub's servers — no Android Studio or local
# Gradle needed. Runs on every push/PR to main, and can also be triggered
# manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # This project intentionally does not commit a gradle-wrapper.jar binary,
      # so we let this action provision Gradle directly (no ./gradlew needed).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneratorSoalSandi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

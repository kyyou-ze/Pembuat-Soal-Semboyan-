name: Sync Incoming Files

# Drop updated/new files into the `incoming/` folder (mirroring the exact
# path they should end up at, e.g. incoming/app/src/main/java/.../Foo.kt)
# and push. This workflow "peeks" at whether that path already exists in
# the repo and overwrites it if so (or creates it if it's new), then
# removes the file from incoming/ and commits the result. It finishes by
# triggering the "Build APK" workflow so you get a fresh APK automatically.
on:
  push:
    branches: [ "main" ]
    paths:
      - "incoming/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge incoming/ into the repo (overwrite matching paths)
        run: |
          set -e
          if [ ! -d "incoming" ]; then
            echo "No incoming/ folder found, nothing to sync."
            exit 0
          fi

          CHANGED=0
          # Find every file under incoming/ (ignore placeholder files).
          while IFS= read -r -d '' file; do
            rel="${file#incoming/}"
            dest="$rel"

            mkdir -p "$(dirname "$dest")"

            if [ -f "$dest" ]; then
              echo "Overwriting existing file: $dest"
            else
              echo "Adding new file: $dest"
            fi

            mv -f "$file" "$dest"
            CHANGED=1
          done < <(find incoming -type f ! -name ".gitkeep" -print0)

          # Clean up now-empty directories under incoming/, keep incoming/ itself.
          find incoming -mindepth 1 -type d -empty -delete || true

          echo "CHANGED=$CHANGED" >> "$GITHUB_ENV"

      - name: Commit and push changes
        if: env.CHANGED == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync files from incoming/"
          git push

      - name: Trigger APK build
        if: env.CHANGED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref main
